name: devbuild

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: devbuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  check_skip:
    uses: ./.github/workflows/check_skip_ci.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read

  build:

    needs: [check_skip]

    if: |
      needs.check_skip.outputs.skip != 'true' &&
      github.event_name == 'pull_request'

    runs-on: ubuntu-24.04

    timeout-minutes: 5

    steps:

      - name: stand in for the heavy build
        run: |
          echo "event: ${{ github.event_name }}"
          echo "action: ${{ github.event.action }}"
          echo "skip: ${{ needs.check_skip.outputs.skip }}"
